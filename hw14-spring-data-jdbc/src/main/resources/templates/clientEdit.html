<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование клиента</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        form {
            max-width: 400px;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }

        .phones input {
            margin-bottom: 6px;
        }

        .actions {
            margin-top: 16px;
        }
    </style>
</head>
<body>

<h1>Редактирование клиента</h1>

    <form th:action="@{/clients/edit}" th:object="${client}"  method="post">
    <!-- clientId (скрыто) -->
    <input type="hidden" th:field="*{clientId}"/>

    <!-- clientName -->
    <label>
        Имя клиента
        <input type="text"
               th:field="*{clientName}"
               required />
    </label>

    <!-- phones -->
    <label>Телефоны</label>

    <div class="phones">

        <div th:each="phone, stat : *{phones}">
            <input type="text"
                   th:name="|phones[${stat.index}]|"
                   th:value="${phone}"
                   placeholder="+7 900 000 00 00"/>
        </div>

        <!-- если телефонов нет -->
        <div th:if="${#lists.isEmpty(client.phones)}">
            <input type="text" name="phones[0]" placeholder="+7 900 000 00 00"/>
        </div>

    </div>

    <div class="actions">
        <button type="submit">Сохранить изменения</button>
        <a href="/clients">Отмена</a>
    </div>

</form>

</body>
</html>
